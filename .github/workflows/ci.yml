name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dogrulama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Testler
        run: npm run test

      - name: Üretim derlemesi
        run: npm run build
